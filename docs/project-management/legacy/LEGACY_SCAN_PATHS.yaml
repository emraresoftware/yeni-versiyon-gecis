# Incremental tarama
scan_commands:
  git_repos: |
    find /Users/emre/Dergah -maxdepth 5 -type d -name '.git' 2>/dev/null \
      | grep -v node_modules | sed 's|/.git||' | sort -u
  manifests: |
    find {paths} -maxdepth 4 \( -name composer.json -o -name '*.sln' -o -name requirements.txt \) 2>/dev/null
